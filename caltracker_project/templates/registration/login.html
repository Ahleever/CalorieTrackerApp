{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5"> 
        <h2 class="mb-4 text-center">Welcome to CalTrack!</h2> 
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                Please Login
            </div>
            <div class="card-body">
                
                <form method="post" id="loginForm">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">Your username and password didn't match.</div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-2">or try the demo</p>
                        <button type="button" class="btn btn-warning w-100" onclick="loginDemoUser()">
                            👤 Login as Demo
                        </button>
                    </div>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'password_reset' %}" class="btn btn-danger w-50">Forgot Password?</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{% url 'register' %}" class="btn btn-success w-50">Sign up here</a>
            </div>
        </div>
    </div>
</div>

<script>
    function loginDemoUser() {
        document.getElementById('id_username').value = 'Demo';
        document.getElementById('id_password').value = 'Password';
        document.getElementById('loginForm').submit();
    }
</script>
{% endblock %}
