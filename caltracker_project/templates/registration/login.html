<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4" style="text-align: center;">Welcome to CalTrack!</h2>
    <h2 class="mb-4" style="text-align: center;">Please Login</h2>

    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <div class="alert alert-danger">Your username and password didn't match.</div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div class="text-center mt-4">
            <a href="{% url 'password_reset' %}" class="btn btn-danger w-50">Forgot Password?</a>
        </div>
        <div class="card-footer text-center mt-4" >
            <a href="{% url 'register' %}" class="btn btn-success w-50">Sign up here</a>
        </div>
    </form>
</body>

</html>
