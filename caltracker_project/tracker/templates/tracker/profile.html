{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
    <h2>Edit Your Profile</h2>
    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" value="{{ profile.age|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Height (inches)</label>
            <input type="number" name="height" class="form-control" value="{{ profile.height|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Current Weight (lbs)</label>
            <input type="number" step="0.1" name="weight" class="form-control" value="{{ profile.current_weight|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Goal Weight (lbs)</label>
            <input type="number" step="0.1" name="goal_weight" class="form-control" value="{{ profile.goal_weight|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Sex</label>
            <select name="sex" class="form-select">
                <option value="Male" {% if profile.sex == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if profile.sex == 'Female' %}selected{% endif %}>Female</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Activity Level</label>
            <select name="activity_level" class="form-select">
                <option value="Sedentary" {% if profile.activity_level == 'Sedentary' %}selected{% endif %}>Sedentary (Office job)</option>
                <option value="Moderate" {% if profile.activity_level == 'Moderate' %}selected{% endif %}>Moderate (Exercise 3-5 days/wk)</option>
                <option value="Active" {% if profile.activity_level == 'Active' %}selected{% endif %}>Active (Daily exercise)</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save Profile</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock content %}
